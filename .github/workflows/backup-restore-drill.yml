name: Backup restore drill

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 1 * *'

permissions:
  contents: read

concurrency:
  group: backup-restore-drill
  cancel-in-progress: false

jobs:
  synthetic-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sales_ai_system_backup_test
      TARGET_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sales_ai_system_restore_test
      MAIL_SEND_ENABLED: 'false'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sales_ai_system_backup_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sales_ai_system_backup_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build migration and database operations artifacts
        run: |
          docker build --target migration --tag sales-ai-system-migration:drill .
          docker build --target database-ops --tag sales-ai-system-database-ops:drill .
      - name: Apply migrations to synthetic source database
        env:
          DATABASE_URL: ${{ env.SOURCE_DATABASE_URL }}
        run: docker run --rm --network host --env DATABASE_URL sales-ai-system-migration:drill
      - name: Add deterministic relation fixture and empty restore database
        env:
          PGPASSWORD: postgres
        run: |
          docker run --rm --network host --entrypoint psql \
            --env PGPASSWORD sales-ai-system-database-ops:drill \
            -h 127.0.0.1 -U postgres -d sales_ai_system_backup_test \
            -v ON_ERROR_STOP=1 -c "
              INSERT INTO \"Organization\" (id, slug, name, \"createdAt\", \"updatedAt\")
              VALUES ('11111111-1111-4111-8111-111111111111', 'restore-drill', 'Restore Drill', now(), now());
              INSERT INTO \"CrowdfundingPlatform\" (id, type, name, \"baseUrl\", \"createdAt\", \"updatedAt\")
              VALUES ('22222222-2222-4222-8222-222222222222', 'campfire', 'CAMPFIRE', 'https://camp-fire.jp', now(), now());
              INSERT INTO \"Company\" (id, \"organizationId\", name, \"createdAt\", \"updatedAt\")
              VALUES ('33333333-3333-4333-8333-333333333333', '11111111-1111-4111-8111-111111111111', 'Drill Company', now(), now());
              INSERT INTO \"CrowdfundingProject\" (id, \"organizationId\", \"platformId\", \"companyId\", title, url, status, \"createdAt\", \"updatedAt\")
              VALUES ('44444444-4444-4444-8444-444444444444', '11111111-1111-4111-8111-111111111111', '22222222-2222-4222-8222-222222222222', '33333333-3333-4333-8333-333333333333', 'Restore Drill Project', 'https://example.invalid/restore-drill', 'active', now(), now());
              INSERT INTO \"SalesLead\" (id, \"organizationId\", \"companyId\", \"projectId\", \"createdAt\", \"updatedAt\")
              VALUES ('55555555-5555-4555-8555-555555555555', '11111111-1111-4111-8111-111111111111', '33333333-3333-4333-8333-333333333333', '44444444-4444-4444-8444-444444444444', now(), now());
            "
          docker run --rm --network host --entrypoint psql \
            --env PGPASSWORD sales-ai-system-database-ops:drill \
            -h 127.0.0.1 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 \
            -c 'CREATE DATABASE sales_ai_system_restore_test' \
            -c "COMMENT ON DATABASE sales_ai_system_restore_test IS 'sales-ai-system:restore-only'"
      - name: Create authenticated encrypted backup
        run: |
          install -d -m 700 "$RUNNER_TEMP/backup"
          umask 077
          openssl rand -hex 32 > "$RUNNER_TEMP/backup.key"
          DATABASE_URL="$SOURCE_DATABASE_URL" docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            --env DATABASE_URL \
            --env APP_ENV=test \
            --env MAIL_SEND_ENABLED=false \
            --env DB_OPS_MODE=native \
            --env BACKUP_OUTPUT_DIR=/backup \
            --env BACKUP_ENCRYPTION_KEY_FILE=/run/secrets/backup.key \
            --env BACKUP_KEY_ID=drill \
            --env BACKUP_STORAGE_LABEL=ci-ephemeral \
            --mount type=bind,src="$RUNNER_TEMP/backup",dst=/backup \
            --mount type=bind,src="$RUNNER_TEMP/backup.key",dst=/run/secrets/backup.key,readonly \
            sales-ai-system-database-ops:drill
      - name: Restore and verify the isolated target
        run: |
          BACKUP_FILE="$(find "$RUNNER_TEMP/backup" -name '*.dump.enc' -print -quit)"
          MANIFEST_FILE="$(find "$RUNNER_TEMP/backup" -name '*.manifest.enc' -print -quit)"
          test -n "$BACKUP_FILE" -a -n "$MANIFEST_FILE"
          RESTORE_TARGET_DATABASE_URL="$TARGET_DATABASE_URL" docker run --rm --network host \
            --user "$(id -u):$(id -g)" \
            --env RESTORE_TARGET_DATABASE_URL \
            --env APP_ENV=test \
            --env RESTORE_TARGET_ENV=test \
            --env RESTORE_CONFIRM=RESTORE_TO_sales_ai_system_restore_test \
            --env MAIL_SEND_ENABLED=false \
            --env DB_OPS_MODE=native \
            --env BACKUP_FILE=/backup/"$(basename "$BACKUP_FILE")" \
            --env BACKUP_MANIFEST_FILE=/backup/"$(basename "$MANIFEST_FILE")" \
            --env BACKUP_ENCRYPTION_KEY_FILE=/run/secrets/backup.key \
            --mount type=bind,src="$RUNNER_TEMP/backup",dst=/backup,readonly \
            --mount type=bind,src="$RUNNER_TEMP/backup.key",dst=/run/secrets/backup.key,readonly \
            sales-ai-system-database-ops:drill scripts/database/restore.js
      - name: Verify restored migration state and zero schema drift
        env:
          DATABASE_URL: ${{ env.TARGET_DATABASE_URL }}
        run: |
          docker run --rm --network host --env DATABASE_URL \
            sales-ai-system-migration:drill \
            npx --no-install prisma migrate status --schema prisma/schema.prisma
          docker run --rm --network host --env DATABASE_URL \
            sales-ai-system-migration:drill \
            npx --no-install prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code
