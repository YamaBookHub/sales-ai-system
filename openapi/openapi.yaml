openapi: 3.0.3
info:
  title: Sales AI System API
  version: 1.0.0
  description: Browser clients authenticate with an opaque server-side session cookie. Unsafe authenticated requests also require the X-CSRF-Token returned by GET /api/auth/me.
servers:
  - url: http://localhost:3000
security:
  - cookieSession: []
paths:
  /:
    get:
      summary: Local URL search dashboard HTML
      x-permission: workspace.read
      responses:
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '200':
          description: Dashboard HTML
          content:
            text/html:
              schema: { type: string }
  /leads-view:
    get:
      summary: Leads dashboard HTML
      x-permission: workspace.read
      responses:
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '200':
          description: Dashboard HTML
          content:
            text/html:
              schema: { type: string }
  /mail-workspace:
    get:
      summary: Mail workspace HTML
      x-permission: workspace.read
      responses:
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '200':
          description: Dashboard HTML
          content:
            text/html:
              schema: { type: string }
  /today:
    get:
      summary: Today dashboard HTML
      x-permission: workspace.read
      responses:
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '200':
          description: Dashboard HTML
          content:
            text/html:
              schema: { type: string }
  /sales-performance:
    get:
      summary: Sales performance dashboard HTML
      x-permission: workspace.read
      responses:
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '200':
          description: Dashboard HTML
          content:
            text/html:
              schema: { type: string }
  /replies:
    get:
      summary: Reply inbox dashboard HTML
      x-permission: workspace.read
      responses:
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '200':
          description: Dashboard HTML
          content:
            text/html:
              schema: { type: string }
  /login:
    get:
      summary: Login page HTML
      security: []
      parameters:
        - name: returnTo
          in: query
          schema: { type: string }
        - name: error
          in: query
          schema:
            type: string
            enum: [not_authorized]
      responses:
        '200':
          description: Login HTML
          content:
            text/html:
              schema: { type: string }
  /api/auth/google/start:
    get:
      summary: Start Google OAuth/OIDC authorization
      security: []
      parameters:
        - name: returnTo
          in: query
          schema: { type: string }
      responses:
        '302':
          description: Redirect to Google authorization
  /api/auth/google/callback:
    get:
      summary: Complete Google OAuth/OIDC authorization and issue a session
      security: []
      parameters:
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          schema: { type: string }
      responses:
        '302':
          description: Session issued and redirected, or denied generically and redirected to login after clearing temporary OAuth state
  /api/auth/local-login:
    post:
      summary: Issue a session for the fixed local development user
      description: Available only in local mode from the configured loopback origin. The user cannot be selected in the request.
      security: []
      responses:
        '201':
          description: Local session issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '403':
          description: Local login is disabled or the origin is invalid
  /api/auth/me:
    get:
      summary: Get the authenticated user and the in-memory CSRF token
      x-permission: workspace.read
      responses:
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '200':
          description: Current authenticated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthMeResponse' }
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
  /api/auth/logout:
    post:
      summary: Revoke the current session
      x-permission: workspace.read
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '201':
          description: Session revoked and cookie cleared
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '401':
          $ref: '#/components/responses/AuthenticationRequired'
        '403':
          $ref: '#/components/responses/CsrfRejected'
  /api/admin/users:
    get:
      summary: List users for administrator management
      x-permission: user.manage
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: role
          in: query
          schema:
            type: string
            enum: [admin, manager, operator, viewer]
        - name: isActive
          in: query
          schema: { type: boolean }
      responses:
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '200':
          description: Paginated user list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserListResponse' }
    post:
      summary: Create a pre-registered user
      x-permission: user.manage
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAdminUserRequest' }
      responses:
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '201':
          description: Created user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/admin/users/{id}:
    patch:
      summary: Update a user's role, name, or active state
      x-permission: user.manage
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAdminUserRequest' }
      responses:
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/admin/users/{id}/revoke-sessions:
    post:
      summary: Revoke all active sessions for a user
      x-permission: user.manage
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '201':
          description: Session revocation result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RevokeUserSessionsResponse' }
  /api/admin/audit-logs:
    get:
      summary: List audit log entries for administrators
      x-permission: audit.read
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: userId
          in: query
          schema: { type: string, format: uuid }
        - name: action
          in: query
          schema: { type: string }
        - name: entityType
          in: query
          schema: { type: string }
        - name: entityId
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '200':
          description: Paginated audit log entries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAuditLogListResponse' }
  /health:
    get:
      summary: Health check
      security: []
      responses:
        '200':
          description: Health response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/navigation-summary:
    get:
      summary: Navigation counters
      x-permission: workspace.read
      responses:
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '200':
          description: Navigation summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/reports/sales-performance:
    get:
      summary: Aggregate sales performance for a sent-lead cohort
      x-permission: reports.read
      parameters:
        - name: from
          in: query
          description: Inclusive actual sent date in Asia/Tokyo (YYYY-MM-DD). Defaults to 29 days before `to`.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Inclusive actual sent date in Asia/Tokyo (YYYY-MM-DD). Defaults to today.
          schema: { type: string, format: date }
        - name: ownerId
          in: query
          description: Current opportunity owner
          schema: { type: string, format: uuid }
        - name: source
          in: query
          description: Acquisition source. `manual` means a lead without a crowdfunding project.
          schema:
            type: string
            enum: [campfire, makuake, green_funding, other, manual]
      responses:
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '200':
          description: Database-backed cohort metrics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SalesPerformanceResponse' }
        '400':
          description: Invalid date or date range
  /api/reports/sales-performance/owners:
    get:
      summary: List current and historical opportunity owners represented in performance data
      x-permission: reports.read
      responses:
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '200':
          description: Performance owner options, including inactive owners
          content:
            application/json:
              schema:
                type: object
                required: [data, meta, error]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/SalesPerformanceOwner'
                  meta:
                    nullable: true
                  error:
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/ErrorResponse'
  /api/companies:
    get:
      summary: List companies
      x-permission: workspace.read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '200':
          description: Company list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
    post:
      summary: Create company
      x-permission: records.write
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCompanyRequest' }
      responses:
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '201':
          description: Company response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/companies/{id}/block:
    post:
      summary: Block a company
      x-permission: compliance.manage
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BlockCompanyRequest' }
      responses:
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '201':
          description: Company response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/companies/{companyId}/contacts:
    get:
      summary: List active contacts for a company
      x-permission: workspace.read
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '200':
          description: Contact list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '404':
          description: Company not found
    post:
      summary: Create a contact for a company
      x-permission: records.write
      parameters:
        - $ref: '#/components/parameters/CompanyId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateContactRequest' }
      responses:
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '201':
          description: Created contact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '404':
          description: Company not found
  /api/contacts/{id}:
    patch:
      summary: Update an active contact
      x-permission: records.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateContactRequest' }
      responses:
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '200':
          description: Updated contact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '404':
          description: Contact not found
  /api/contacts/{id}/archive:
    post:
      summary: Archive an active contact
      x-permission: records.write
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '201':
          description: Archived contact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '404':
          description: Contact not found
  /api/contacts/{id}/unsubscribe:
    post:
      summary: Mark an active contact as unsubscribed
      x-permission: compliance.manage
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '201':
          description: Unsubscribed contact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '404':
          description: Contact not found
  /api/projects:
    get:
      summary: List crowdfunding projects
      x-permission: workspace.read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ProjectStatus' }
      responses:
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '200':
          description: Project list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
    post:
      summary: Create crowdfunding project
      x-permission: prospecting.execute
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectRequest' }
      responses:
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '201':
          description: Project response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/projects/import/campfire:
    post:
      summary: Import a CAMPFIRE project
      x-permission: prospecting.execute
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportCampfireProjectRequest' }
      responses:
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '201':
          description: Import response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/projects/import:
    post:
      summary: Import a project from a supported source
      x-permission: prospecting.execute
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportProjectRequest' }
      responses:
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '201':
          description: Import response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/projects/bulk-import:
    post:
      summary: Bulk import projects
      x-permission: prospecting.execute
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkImportProjectsRequest' }
      responses:
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '201':
          description: Bulk import summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/projects/categories/campfire:
    get:
      summary: List CAMPFIRE categories
      x-permission: workspace.read
      responses:
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '200':
          description: Category response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/projects/categories:
    get:
      summary: List categories for a source
      x-permission: workspace.read
      parameters:
        - name: source
          in: query
          schema:
            type: string
            default: campfire
      responses:
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '200':
          description: Category response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/projects/search/campfire:
    post:
      summary: Search CAMPFIRE project candidates
      x-permission: prospecting.execute
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchCampfireProjectsRequest' }
      responses:
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '201':
          description: Search response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/projects/search:
    post:
      summary: Search project candidates by source
      x-permission: prospecting.execute
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchProjectsRequest' }
      responses:
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '201':
          description: Search response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/projects/search-jobs:
    post:
      summary: Start an asynchronous project search job
      x-permission: prospecting.execute
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchProjectsRequest' }
      responses:
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '201':
          description: Search job response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectSearchJobResponse' }
  /api/projects/search-jobs/{id}:
    get:
      summary: Get a project search job
      x-permission: workspace.read
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '200':
          description: Search job response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectSearchJobResponse' }
  /api/projects/search-jobs/{id}/cancel:
    post:
      summary: Cancel a project search job
      x-permission: prospecting.execute
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '201':
          description: Search job response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectSearchJobResponse' }
  /api/leads:
    get:
      summary: List sales leads
      x-permission: workspace.read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/LeadLimit'
        - name: keyword
          in: query
          description: Case-insensitive match against company name, project title, URL, description, lead reason, or owner memo.
          schema: { type: string, maxLength: 200 }
        - name: source
          in: query
          description: Project platform type. It does not use the internal SalesLead source label.
          schema: { $ref: '#/components/schemas/PlatformType' }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/LeadStatus' }
        - name: priority
          in: query
          schema: { $ref: '#/components/schemas/LeadPriority' }
        - name: contactState
          in: query
          description: "`has` requires a legacy lead contact value or an active company contact with email or inquiry URL. Deleted and unsubscribed company contacts are ignored; `none` has neither."
          schema: { type: string, enum: [has, none] }
        - name: mailStatus
          in: query
          description: Status of the latest mail for the lead, ordered by createdAt then id descending. `none` selects leads without any mail.
          schema: { type: string, enum: [none, draft, in_review, rejected, approved, queued, sending, sent, failed, cancelled] }
        - name: nextAction
          in: query
          description: "`any` applies no next-action filter. `scheduled` has a next-action date, follow-up date, or active task. `overdue` has one due at or before the server time. `none` has none of those values."
          schema: { type: string, enum: [any, scheduled, overdue, none] }
        - name: sort
          in: query
          schema: { type: string, enum: [company, project, amount, supporters, daysLeft, score, priority, createdAt], default: createdAt }
        - name: sortDirection
          in: query
          description: Defaults to `desc` for `createdAt` and `asc` for other sort fields.
          schema: { type: string, enum: [asc, desc] }
      responses:
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '200':
          description: Lead list. `data.summary` is calculated after source, status, priority, and nextAction filters, before contactState and mailStatus summary selections.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LeadListData' }
    post:
      summary: Create a sales lead
      x-permission: records.write
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLeadRequest' }
      responses:
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '201':
          description: Lead response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/opportunities:
    get:
      summary: List opportunities
      x-permission: workspace.read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/OpportunityLimit'
        - name: stage
          in: query
          schema: { $ref: '#/components/schemas/OpportunityStage' }
        - name: ownerId
          in: query
          schema: { type: string, format: uuid }
        - name: source
          in: query
          schema: { $ref: '#/components/schemas/PlatformType' }
        - name: expectedCloseFrom
          in: query
          schema: { type: string, format: date-time }
        - name: expectedCloseTo
          in: query
          schema: { type: string, format: date-time }
        - name: updatedFrom
          in: query
          schema: { type: string, format: date-time }
        - name: updatedTo
          in: query
          schema: { type: string, format: date-time }
      responses:
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '200':
          description: Paginated opportunity list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/leads/{leadId}/opportunity:
    get:
      summary: Get the opportunity for a lead
      x-permission: workspace.read
      parameters:
        - $ref: '#/components/parameters/LeadId'
      responses:
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '200':
          description: Opportunity with recent history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '404':
          description: Lead not found
    patch:
      summary: Update opportunity details with optimistic locking
      x-permission: opportunity.write
      parameters:
        - $ref: '#/components/parameters/LeadId'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateOpportunityRequest' }
      responses:
        '403':
