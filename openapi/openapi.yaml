      type: object
      required: [key, name, body]
      properties:
        key: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        channel: { type: string }
        subject: { type: string }
        body: { type: string, minLength: 1 }
        description: { type: string }
        isActive: { type: boolean }
    ImportMailTemplatesRequest:
      type: object
      required: [templates]
      properties:
        templates:
          type: array
          items: { $ref: '#/components/schemas/SaveMailTemplateRequest' }
    CreateMailDraftRequest:
      type: object
      required: [leadId, analysisRevisionId, templateKey]
      properties:
        leadId: { type: string, format: uuid }
        analysisRevisionId: { type: string, format: uuid }
        templateKey: { type: string, minLength: 1 }
        manualInstruction: { type: string }
    UpdateMailRequest:
      type: object
      properties:
        subject: { type: string }
        body: { type: string }
    UpdateMailChecklistRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UpdateMailChecklistItem'
    UpdateMailChecklistItem:
      type: object
      required: [key, label, checked]
      properties:
        key: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
        checked: { type: boolean }
    RejectMailRequest:
      type: object
      properties:
        reason: { type: string }
    MarkMailSentRequest:
      type: object
      properties:
        sentAt: { type: string, format: date-time }
    CreateMailReplyRequest:
      type: object
      required: [body]
      properties:
        fromEmail: { type: string }
        body: { type: string, minLength: 1 }
        receivedAt: { type: string, format: date-time }
    GenerateMailRequest:
      type: object
      required: [templateKey, analysisRevisionId]
      properties:
        templateKey: { type: string, minLength: 1 }
        tone: { type: string }
        analysisRevisionId: { type: string, format: uuid }
    OpenAiUsageSummary:
      type: object
      required: [provider, month, configured, budgetUsd, spentUsd, reservedUsd, remainingUsd, usagePercent, blocked, statusMessage]
      properties:
        provider:
          type: string
          enum: [openai]
        month: { type: string, pattern: '^\\d{4}-\\d{2}$' }
        configured: { type: boolean }
        budgetUsd: { type: number, format: double, nullable: true, minimum: 0 }
        spentUsd: { type: number, format: double, minimum: 0 }
        reservedUsd: { type: number, format: double, minimum: 0 }
        remainingUsd: { type: number, format: double, nullable: true, minimum: 0 }
        usagePercent: { type: number, format: double, nullable: true, minimum: 0 }
        blocked: { type: boolean }
        statusMessage: { type: string }
    LeadAnalysisRevisionRequest:
      type: object
      required: [expectedVersion, expectedSourceFingerprint, appeal, targetUser, videoIdea]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
        expectedSourceFingerprint: { type: string, minLength: 32, maxLength: 32 }
        appeal: { type: string, maxLength: 1000 }
        targetUser: { type: string, maxLength: 1000 }
        videoIdea: { type: string, maxLength: 1000 }
    LeadAnalysisRevision:
      type: object
      required: [id, leadId, projectId, version, status, origin, sourceFingerprint, humanEdited, editedFields, createdAt]
      properties:
        id: { type: string, format: uuid }
        leadId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        sourceGenerationId: { type: string, format: uuid, nullable: true }
        changedById: { type: string, format: uuid, nullable: true }
        version: { type: integer, minimum: 1 }
        status:
          type: string
          enum: [draft, confirmed]
        origin:
          type: string
          enum: [generated, manual, migration]
        appeal: { type: string, nullable: true }
        targetUser: { type: string, nullable: true }
        videoIdea: { type: string, nullable: true }
        sourceFingerprint: { type: string, minLength: 1 }
        generatedAt: { type: string, format: date-time, nullable: true }
        confirmedAt: { type: string, format: date-time, nullable: true }
        humanEdited: { type: boolean }
        editedFields:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        stale: { type: boolean }
        missingFields:
          type: array
          items:
            type: string
            enum: [appeal, targetUser, videoIdea]
    LeadAnalysisResponse:
      type: object
      required: [projectId, sourceFingerprint, proposal, confirmed, history, missingFields, stale, canGenerateMail]
      properties:
        projectId: { type: string, format: uuid }
        sourceFingerprint: { type: string, minLength: 32, maxLength: 32 }
        proposal:
          allOf:
            - $ref: '#/components/schemas/LeadAnalysisRevision'
          nullable: true
        confirmed:
          allOf:
            - $ref: '#/components/schemas/LeadAnalysisRevision'
          nullable: true
        history:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/LeadAnalysisRevision'
        missingFields:
          type: array
          items:
            type: string
            enum: [appeal, targetUser, videoIdea]
        stale: { type: boolean }
        canGenerateMail: { type: boolean }
    CreateTrackedLinkRequest:
      type: object
      required: [emailId, originalUrl]
      properties:
        emailId: { type: string, format: uuid }
        originalUrl: { type: string, minLength: 1 }
        label:
          type: string
          enum: [company_material]
    UnsubscribeRequest:
      type: object
      properties:
        email: { type: string }
        contactId: { type: string }
