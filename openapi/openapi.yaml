              schema: { $ref: '#/components/schemas/ApiResponse' }
  /t/click/{token}:
    get:
      summary: Record a tracked click and redirect
      security: []
      parameters:
        - $ref: '#/components/parameters/Token'
      responses:
        '302':
          description: Redirect to the original URL
          headers:
            Location:
              schema: { type: string, format: uri }
  /api/unsubscribe:
    post:
      summary: Mark a contact or email as unsubscribed
      x-permission: compliance.manage
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnsubscribeRequest' }
      responses:
        '403':
          $ref: '#/components/responses/AuthorizationDenied'
        '201':
          description: Unsubscribe response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
components:
