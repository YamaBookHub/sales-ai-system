openapi: 3.0.3
info:
  title: Sales AI System API
  version: 1.0.0
servers:
  - url: http://localhost:3000
security:
  - bearerAuth: []
paths:
  /:
    get:
      summary: Local URL search dashboard HTML
      security: []
      responses:
        '200':
          description: Dashboard HTML
          content:
            text/html:
              schema: { type: string }
  /leads-view:
    get:
      summary: Leads dashboard HTML
      security: []
      responses:
        '200':
          description: Dashboard HTML
          content:
            text/html:
              schema: { type: string }
  /mail-workspace:
    get:
      summary: Mail workspace HTML
      security: []
      responses:
        '200':
          description: Dashboard HTML
          content:
            text/html:
              schema: { type: string }
  /today:
    get:
      summary: Today dashboard HTML
      security: []
      responses:
        '200':
          description: Dashboard HTML
          content:
            text/html:
              schema: { type: string }
  /replies:
    get:
      summary: Reply inbox dashboard HTML
      security: []
      responses:
        '200':
          description: Dashboard HTML
          content:
            text/html:
              schema: { type: string }
  /health:
    get:
      summary: Health check
      security: []
      responses:
        '200':
          description: Health response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/navigation-summary:
    get:
      summary: Navigation counters
      responses:
        '200':
          description: Navigation summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/companies:
    get:
      summary: List companies
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Company list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
    post:
      summary: Create company
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCompanyRequest' }
      responses:
        '201':
          description: Company response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/companies/{id}/block:
    post:
      summary: Block a company
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BlockCompanyRequest' }
      responses:
        '201':
          description: Company response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/companies/{companyId}/contacts:
    get:
      summary: List active contacts for a company
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      responses:
        '200':
          description: Contact list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '404':
          description: Company not found
    post:
      summary: Create a contact for a company
      parameters:
        - $ref: '#/components/parameters/CompanyId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateContactRequest' }
      responses:
        '201':
          description: Created contact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '404':
          description: Company not found
  /api/contacts/{id}:
    patch:
      summary: Update an active contact
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateContactRequest' }
      responses:
        '200':
          description: Updated contact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '404':
          description: Contact not found
  /api/contacts/{id}/archive:
    post:
      summary: Archive an active contact
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '201':
          description: Archived contact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '404':
          description: Contact not found
  /api/contacts/{id}/unsubscribe:
    post:
      summary: Mark an active contact as unsubscribed
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '201':
          description: Unsubscribed contact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '404':
          description: Contact not found
  /api/projects:
    get:
      summary: List crowdfunding projects
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/ProjectStatus' }
      responses:
        '200':
          description: Project list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
    post:
      summary: Create crowdfunding project
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectRequest' }
      responses:
        '201':
          description: Project response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/projects/import/campfire:
    post:
      summary: Import a CAMPFIRE project
      parameters:
        - $ref: '#/components/parameters/OperatorEmail'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportCampfireProjectRequest' }
      responses:
        '201':
          description: Import response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/projects/import:
    post:
      summary: Import a project from a supported source
      parameters:
        - $ref: '#/components/parameters/OperatorEmail'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportProjectRequest' }
      responses:
        '201':
          description: Import response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/projects/bulk-import:
    post:
      summary: Bulk import projects
      parameters:
        - $ref: '#/components/parameters/OperatorEmail'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkImportProjectsRequest' }
      responses:
        '201':
          description: Bulk import summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/projects/categories/campfire:
    get:
      summary: List CAMPFIRE categories
      responses:
        '200':
          description: Category response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/projects/categories:
    get:
      summary: List categories for a source
      parameters:
        - name: source
          in: query
          schema:
            type: string
            default: campfire
      responses:
        '200':
          description: Category response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/projects/search/campfire:
    post:
      summary: Search CAMPFIRE project candidates
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchCampfireProjectsRequest' }
      responses:
        '201':
          description: Search response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/projects/search:
    post:
      summary: Search project candidates by source
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchProjectsRequest' }
      responses:
        '201':
          description: Search response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/projects/search-jobs:
    post:
      summary: Start an asynchronous project search job
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SearchProjectsRequest' }
      responses:
        '201':
          description: Search job response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectSearchJobResponse' }
  /api/projects/search-jobs/{id}:
    get:
      summary: Get a project search job
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Search job response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectSearchJobResponse' }
  /api/projects/search-jobs/{id}/cancel:
    post:
      summary: Cancel a project search job
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '201':
          description: Search job response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectSearchJobResponse' }
  /api/leads:
    get:
      summary: List sales leads
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/LeadStatus' }
        - name: priority
          in: query
          schema: { $ref: '#/components/schemas/LeadPriority' }
      responses:
        '200':
          description: Lead list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
    post:
      summary: Create a sales lead
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLeadRequest' }
      responses:
        '201':
          description: Lead response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/opportunities:
    get:
      summary: List opportunities
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/OpportunityLimit'
        - name: stage
          in: query
          schema: { $ref: '#/components/schemas/OpportunityStage' }
        - name: ownerId
          in: query
          schema: { type: string, format: uuid }
        - name: source
          in: query
          schema: { $ref: '#/components/schemas/PlatformType' }
        - name: expectedCloseFrom
          in: query
          schema: { type: string, format: date-time }
        - name: expectedCloseTo
          in: query
          schema: { type: string, format: date-time }
        - name: updatedFrom
          in: query
          schema: { type: string, format: date-time }
        - name: updatedTo
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Paginated opportunity list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/leads/{leadId}/opportunity:
    get:
      summary: Get the opportunity for a lead
      parameters:
        - $ref: '#/components/parameters/LeadId'
      responses:
        '200':
          description: Opportunity with recent history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '404':
          description: Lead not found
    patch:
      summary: Update opportunity details with optimistic locking
      parameters:
        - $ref: '#/components/parameters/LeadId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateOpportunityRequest' }
      responses:
        '200':
          description: Updated opportunity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '409':
          description: Version conflict
  /api/leads/{leadId}/opportunity/transitions:
    post:
      summary: Transition an opportunity
      parameters:
        - $ref: '#/components/parameters/LeadId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransitionOpportunityRequest' }
      responses:
        '201':
          description: Transitioned opportunity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '400':
          description: Invalid stage fields
        '409':
          description: Invalid transition or version conflict
  /api/leads/{leadId}/opportunity/reopen:
    post:
      summary: Reopen a lost or excluded opportunity
      parameters:
        - $ref: '#/components/parameters/LeadId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReopenOpportunityRequest' }
      responses:
        '201':
          description: Reopened opportunity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '409':
          description: Reopen conflict
  /api/leads/{leadId}/opportunity/history:
    get:
      summary: List opportunity stage history
      parameters:
        - $ref: '#/components/parameters/LeadId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/OpportunityLimit'
      responses:
        '200':
          description: Paginated append-only history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/leads/today:
    get:
      summary: List today's actionable sales leads
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Paginated today and overdue work with category counts
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/leads/{id}:
    get:
      summary: Get a sales lead
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Lead response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
    patch:
      summary: Update a sales lead
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateLeadRequest' }
      responses:
        '200':
          description: Lead response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/leads/{id}/score:
    post:
      summary: Recalculate lead score
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '201':
          description: Score response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/leads/{leadId}/tasks:
    get:
      summary: List tasks for a lead
      parameters:
        - $ref: '#/components/parameters/LeadId'
        - name: scope
          in: query
          schema:
            type: string
            enum: [active, all]
            default: active
      responses:
        '200':
          description: Task list response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
    post:
      summary: Create a task for a lead
      parameters:
        - $ref: '#/components/parameters/LeadId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTaskRequest' }
      responses:
        '201':
          description: Task response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/tasks/{taskId}:
    patch:
      summary: Update a task
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateTaskRequest' }
      responses:
        '200':
          description: Task response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/task-assignees:
    get:
      summary: List active task assignees
      responses:
        '200':
          description: Assignee response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/mails:
    get:
      summary: List mails
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/EmailStatus' }
      responses:
        '200':
          description: Mail list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/mails/draft:
    post:
      summary: Create a mail draft
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMailDraftRequest' }
      responses:
        '201':
          description: Mail response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/mails/templates:
    get:
      summary: List active mail templates
      parameters:
        - name: channel
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Template response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
    post:
      summary: Save or update a mail template
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveMailTemplateRequest' }
      responses:
        '201':
          description: Template response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/mails/templates/{key}:
    get:
      summary: Get a mail template by key
      parameters:
        - $ref: '#/components/parameters/TemplateKey'
      responses:
        '200':
          description: Template response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/mails/templates/import:
    post:
      summary: Import mail templates
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ImportMailTemplatesRequest' }
      responses:
        '201':
          description: Template import response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/mails/{id}:
    patch:
      summary: Update mail subject or body
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMailRequest' }
      responses:
        '200':
          description: Mail response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/mails/{id}/consistency:
    get:
      summary: Check draft consistency
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Consistency response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/mails/{id}/checklist:
    get:
      summary: Get mail checklist
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Checklist response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
    patch:
      summary: Update mail checklist
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMailChecklistRequest' }
      responses:
        '200':
          description: Checklist response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/mails/{id}/request-review:
    post:
      summary: Request mail review
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '201':
          description: Mail response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/mails/{id}/request-rereview:
    post:
      summary: Request mail re-review
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '201':
          description: Mail response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/mails/{id}/approve:
    post:
      summary: Approve a mail
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '201':
          description: Mail response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/mails/{id}/reject:
    post:
      summary: Reject a mail
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RejectMailRequest' }
      responses:
        '201':
          description: Mail response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/mails/{id}/queue:
    post:
      summary: Queue an approved mail
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '201':
          description: Mail response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/mails/{id}/mark-sent:
    post:
      summary: Mark a mail as sent after manual recovery
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MarkMailSentRequest' }
      responses:
        '201':
          description: Mail response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/mails/{id}/send:
    post:
      summary: Send a queued mail through the configured provider
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '201':
          description: Mail response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/mails/{id}/replies:
    post:
      summary: Record a reply for a mail
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMailReplyRequest' }
      responses:
        '201':
          description: Reply response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/mails/{id}/retry:
    post:
      summary: Retry a mail workflow
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '201':
          description: Mail response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/mails/{id}/cancel:
    post:
      summary: Cancel a mail
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '201':
          description: Mail response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/mails/threads/{gmailThreadId}:
    get:
      summary: Get a Gmail thread
      parameters:
        - $ref: '#/components/parameters/GmailThreadId'
      responses:
        '200':
          description: Thread response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/replies:
    get:
      summary: List reply inbox items
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ReplyLimit'
        - name: category
          in: query
          schema: { $ref: '#/components/schemas/ReplyCategory' }
        - name: attention
          in: query
          schema:
            type: string
            enum: [all, needs_action, manager_review, stop_followup]
        - name: leadStatus
          in: query
          schema: { $ref: '#/components/schemas/LeadStatus' }
        - name: sort
          in: query
          schema:
            type: string
            enum: [receivedAt, priority, confidence]
        - name: direction
          in: query
          schema:
            type: string
            enum: [asc, desc]
      responses:
        '200':
          description: Reply inbox response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/ai/leads/{leadId}/generate-mail:
    post:
      summary: Generate a mail draft for a lead
      parameters:
        - $ref: '#/components/parameters/LeadId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateMailRequest' }
      responses:
        '201':
          description: AI response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/ai/leads/{leadId}/email-draft:
    post:
      summary: Generate a mail draft alias for a lead
      parameters:
        - $ref: '#/components/parameters/LeadId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateMailRequest' }
      responses:
        '201':
          description: AI response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/ai/leads/{leadId}/analyze:
    post:
      summary: Analyze a lead
      parameters:
        - $ref: '#/components/parameters/LeadId'
      responses:
        '201':
          description: AI response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/ai/mails/{mailId}/polish:
    post:
      summary: Polish a mail
      parameters:
        - $ref: '#/components/parameters/MailId'
      responses:
        '201':
          description: AI response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/ai/mails/{mailId}/semantic-consistency:
    post:
      summary: Check mail semantic consistency
      parameters:
        - $ref: '#/components/parameters/MailId'
      responses:
        '201':
          description: AI response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/ai/leads/{leadId}/generations:
    get:
      summary: List AI generations for a lead
      parameters:
        - $ref: '#/components/parameters/LeadId'
      responses:
        '200':
          description: AI generation response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/ai/replies/{replyId}/classify:
    post:
      summary: Classify a reply
      parameters:
        - $ref: '#/components/parameters/ReplyId'
      responses:
        '201':
          description: AI response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /t/open/{emailId}.png:
    get:
      summary: Track an email open
      security: []
      parameters:
        - $ref: '#/components/parameters/EmailId'
      responses:
        '200':
          description: Transparent 1x1 GIF
          content:
            image/gif:
              schema: { type: string, format: binary }
  /api/t/links:
    post:
      summary: Create a tracked link
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTrackedLinkRequest' }
      responses:
        '201':
          description: Tracking link response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /api/t/mails/{emailId}/engagement:
    get:
      summary: Get mail material engagement
      parameters:
        - $ref: '#/components/parameters/EmailId'
      responses:
        '200':
          description: Engagement response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
  /t/click/{token}:
    get:
      summary: Record a tracked click and redirect
      security: []
      parameters:
        - $ref: '#/components/parameters/Token'
      responses:
        '302':
          description: Redirect to the original URL
          headers:
            Location:
              schema: { type: string, format: uri }
  /api/unsubscribe:
    post:
      summary: Mark a contact or email as unsubscribed
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UnsubscribeRequest' }
      responses:
        '201':
          description: Unsubscribe response
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, default: 20 }
    OpportunityLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    ReplyLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100 }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    CompanyId:
      name: companyId
      in: path
      required: true
      schema: { type: string, format: uuid }
    LeadId:
      name: leadId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MailId:
      name: mailId
      in: path
      required: true
      schema: { type: string }
    EmailId:
      name: emailId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ReplyId:
      name: replyId
      in: path
      required: true
      schema: { type: string }
    GmailThreadId:
      name: gmailThreadId
      in: path
      required: true
      schema: { type: string }
    TemplateKey:
      name: key
      in: path
      required: true
      schema: { type: string }
    Token:
      name: token
      in: path
      required: true
      schema: { type: string }
    OperatorEmail:
      name: x-operator-email
      in: header
      required: false
      schema: { type: string, format: email }
  schemas:
    ApiResponse:
      type: object
      required: [data, meta, error]
      properties:
        data: {}
        meta:
          type: object
          nullable: true
          additionalProperties: true
        error:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ErrorResponse'
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        details:
          type: object
          additionalProperties: true
    ProjectSource:
      type: string
      enum: [campfire, makuake, green_funding]
    PlatformType:
      type: string
      enum: [campfire, makuake, green_funding, other]
    ProjectStatus:
      type: string
      enum: [discovered, active, ended, suspended, unknown]
    LeadStatus:
      type: string
      enum: [discovered, qualified, drafted, reviewing, approved, queued, contacted, replied, meeting_candidate, rejected, no_response, archived]
    LeadPriority:
      type: string
      enum: [high, medium, low]
    EmailStatus:
      type: string
      enum: [draft, in_review, rejected, approved, queued, sending, sent, failed, cancelled]
    ReplyCategory:
      type: string
      enum: [interested, need_info, meeting_request, not_interested, unsubscribe, auto_reply, complaint, unknown]
    TaskStatus:
      type: string
      enum: [todo, doing, done, cancelled]
    OpportunityStage:
      type: string
      enum: [uncontacted, contacted, replied, meeting, proposal, won, lost, excluded]
    OpportunityLossReason:
      type: string
      enum: [no_interest, no_budget, timing, no_response, competitor, service_mismatch, contact_unavailable, duplicate, other]
    OpportunityChangeSource:
      type: string
      enum: [manual, system, migration]
    UpdateOpportunityRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        ownerId: { type: string, format: uuid, nullable: true }
        probability: { type: integer, minimum: 0, maximum: 100 }
        expectedAmount: { type: integer, minimum: 0, nullable: true }
        meetingScheduledAt: { type: string, format: date-time, nullable: true }
        expectedCloseDate: { type: string, format: date-time, nullable: true }
    TransitionOpportunityRequest:
      type: object
      required: [expectedVersion, operationKey, toStage]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        operationKey: { type: string, format: uuid }
        toStage: { $ref: '#/components/schemas/OpportunityStage' }
        reason: { type: string, maxLength: 2000 }
        probability: { type: integer, minimum: 0, maximum: 100 }
        expectedAmount: { type: integer, minimum: 0 }
        meetingScheduledAt: { type: string, format: date-time, nullable: true }
        expectedCloseDate: { type: string, format: date-time, nullable: true }
        wonAmount: { type: integer, minimum: 0 }
        lossReason: { $ref: '#/components/schemas/OpportunityLossReason' }
        lossReasonDetail: { type: string, maxLength: 2000 }
    ReopenOpportunityRequest:
      type: object
      required: [expectedVersion, operationKey, toStage, reason]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
        operationKey: { type: string, format: uuid }
        toStage: { $ref: '#/components/schemas/OpportunityStage' }
        reason: { type: string, maxLength: 2000 }
    Opportunity:
      type: object
      required: [id, leadId, stage, probability, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        leadId: { type: string, format: uuid }
        ownerId: { type: string, format: uuid, nullable: true }
        stage: { $ref: '#/components/schemas/OpportunityStage' }
        probability: { type: integer, minimum: 0, maximum: 100 }
        expectedAmount: { type: integer, minimum: 0, nullable: true }
        wonAmount: { type: integer, minimum: 0, nullable: true }
        meetingScheduledAt: { type: string, format: date-time, nullable: true }
        expectedCloseDate: { type: string, format: date-time, nullable: true }
        wonAt: { type: string, format: date-time, nullable: true }
        lostAt: { type: string, format: date-time, nullable: true }
        lossReason: { $ref: '#/components/schemas/OpportunityLossReason' }
        lossReasonDetail: { type: string, nullable: true }
        stageChangedAt: { type: string, format: date-time }
        version: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OpportunityStageHistory:
      type: object
      required: [id, opportunityId, toStage, source, versionAfter, createdAt]
      properties:
        id: { type: string, format: uuid }
        opportunityId: { type: string, format: uuid }
        fromStage: { $ref: '#/components/schemas/OpportunityStage' }
        toStage: { $ref: '#/components/schemas/OpportunityStage' }
        changedById: { type: string, format: uuid, nullable: true }
        source: { $ref: '#/components/schemas/OpportunityChangeSource' }
        sourceId: { type: string, nullable: true }
        reason: { type: string, nullable: true }
        operationKey: { type: string, nullable: true }
        versionAfter: { type: integer, minimum: 1 }
        snapshot: { type: object, nullable: true, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    CreateCompanyRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        websiteUrl: { type: string }
        inquiryUrl: { type: string }
        industry: { type: string }
        memo: { type: string }
    BlockCompanyRequest:
      type: object
      properties:
        blockedReason: { type: string }
    CreateContactRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, nullable: true }
        email: { type: string, format: email, nullable: true }
        inquiryUrl: { type: string, format: uri, nullable: true }
        roleTitle: { type: string, nullable: true }
        isPrimary: { type: boolean }
    UpdateContactRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, nullable: true }
        email: { type: string, format: email, nullable: true }
        inquiryUrl: { type: string, format: uri, nullable: true }
        roleTitle: { type: string, nullable: true }
        isPrimary: { type: boolean }
        isUnsubscribed: { type: boolean }
    CreateProjectRequest:
      type: object
      required: [platformId, title, url]
      properties:
        platformId: { type: string, format: uuid }
        companyId: { type: string, format: uuid }
        title: { type: string, minLength: 1 }
        url: { type: string, minLength: 1 }
        status: { $ref: '#/components/schemas/ProjectStatus' }
        amount: { type: integer }
        supporterCount: { type: integer }
        category: { type: string }
    ImportCampfireProjectRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, minLength: 1 }
    ImportProjectRequest:
      allOf:
        - $ref: '#/components/schemas/ImportCampfireProjectRequest'
        - type: object
          required: [source]
          properties:
            source: { $ref: '#/components/schemas/ProjectSource' }
    BulkImportProjectsRequest:
      type: object
      required: [source, urls]
      properties:
        source: { $ref: '#/components/schemas/ProjectSource' }
        urls:
          type: array
          items: { type: string }
        importConcurrency: { type: integer }
        analysisConcurrency: { type: integer }
        analyze: { type: boolean }
    SearchCampfireProjectsRequest:
      type: object
      properties:
        keyword: { type: string }
        category: { type: string }
        amountMin: { type: integer }
        amountMax: { type: integer }
        supporterMin: { type: integer }
        supporterMax: { type: integer }
        profileProjectMin: { type: integer }
        profileProjectMax: { type: integer }
        limit: { type: integer }
        status: { type: string }
        endingSoonDays: { type: integer }
        excludeUrls:
          type: array
          items: { type: string }
    SearchProjectsRequest:
      allOf:
        - $ref: '#/components/schemas/SearchCampfireProjectsRequest'
        - type: object
          properties:
            source: { $ref: '#/components/schemas/ProjectSource' }
    ProjectSearchCompletionReason:
      type: string
      enum: [desired_reached, source_exhausted, condition_shortage, excluded_existing, cancelled, failed]
    ProjectSearchDiagnostics:
      type: object
      required: [sourceCandidateCount, conditionMatchedCount, excludedCount, scanComplete]
      properties:
        sourceCandidateCount: { type: integer, minimum: 0 }
        conditionMatchedCount: { type: integer, minimum: 0 }
        excludedCount: { type: integer, minimum: 0 }
        scanComplete: { type: boolean }
    ProjectSearchJob:
      type: object
      required: [id, status, source, desiredLimit, searchedLimit, items, itemCount, importableCount, message, startedAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        status:
          type: string
          enum: [running, completed, cancelled, failed]
        source: { $ref: '#/components/schemas/ProjectSource' }
        desiredLimit: { type: integer, minimum: 1 }
        searchedLimit: { type: integer, minimum: 0 }
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        itemCount: { type: integer, minimum: 0 }
        importableCount: { type: integer, minimum: 0 }
        diagnostics: { $ref: '#/components/schemas/ProjectSearchDiagnostics' }
        completionReason: { $ref: '#/components/schemas/ProjectSearchCompletionReason' }
        message: { type: string }
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProjectSearchJobResponse:
      type: object
      required: [data, meta, error]
      properties:
        data: { $ref: '#/components/schemas/ProjectSearchJob' }
        meta:
          type: object
          nullable: true
          additionalProperties: true
        error:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ErrorResponse'
    CreateLeadRequest:
      type: object
      required: [companyId]
      properties:
        companyId: { type: string, format: uuid }
        projectId: { type: string, format: uuid }
        source: { type: string }
        ownerMemo: { type: string }
        nextActionAt: { type: string, format: date-time }
        contactEmail: { type: string }
        contactFormUrl: { type: string }
        siteMessageUrl: { type: string }
        contactMemo: { type: string }
        sendMethod: { type: string }
        sentAt: { type: string, format: date-time }
        nextFollowUpAt: { type: string, format: date-time }
        brandWebsiteUrl: { type: string }
        instagramUrl: { type: string }
        tiktokUrl: { type: string }
        xUrl: { type: string }
        brandAnalysisMemo: { type: string }
        snsAnalysisMemo: { type: string }
    UpdateLeadRequest:
      type: object
      properties:
        status: { $ref: '#/components/schemas/LeadStatus' }
        priority: { $ref: '#/components/schemas/LeadPriority' }
        ownerMemo: { type: string, nullable: true }
        nextActionAt: { type: string, format: date-time, nullable: true }
        contactEmail: { type: string, format: email, nullable: true }
        contactFormUrl: { type: string, format: uri, nullable: true }
        siteMessageUrl: { type: string, format: uri, nullable: true }
        contactMemo: { type: string, nullable: true }
        sendMethod: { type: string, nullable: true }
        sentAt: { type: string, format: date-time, nullable: true }
        nextFollowUpAt: { type: string, format: date-time, nullable: true }
        brandWebsiteUrl: { type: string, format: uri, nullable: true }
        instagramUrl: { type: string, format: uri, nullable: true }
        tiktokUrl: { type: string, format: uri, nullable: true }
        xUrl: { type: string, format: uri, nullable: true }
        brandAnalysisMemo: { type: string, nullable: true }
        snsAnalysisMemo: { type: string, nullable: true }
        leadReason: { type: string, nullable: true }
        companyName: { type: string, minLength: 1 }
        companyWebsiteUrl: { type: string, format: uri, nullable: true }
        companyInquiryUrl: { type: string, format: uri, nullable: true }
        companyIndustry: { type: string, nullable: true }
        companyLocation: { type: string, nullable: true }
        companySourceTotalAmount: { type: integer, minimum: 0, nullable: true }
        companySourceProjectCount: { type: integer, minimum: 0, nullable: true }
        companySourceSupporterCount: { type: integer, minimum: 0, nullable: true }
        companyMemo: { type: string, nullable: true }
        projectTitle: { type: string, minLength: 1 }
        projectUrl: { type: string, format: uri }
        projectSource: { $ref: '#/components/schemas/PlatformType' }
        projectStatus: { $ref: '#/components/schemas/ProjectStatus' }
        projectAmount: { type: integer, minimum: 0 }
        projectSupporterCount: { type: integer, minimum: 0 }
        projectTargetAmount: { type: integer, minimum: 0, nullable: true }
        projectStartDate: { type: string, format: date-time, nullable: true }
        projectEndDate: { type: string, format: date-time, nullable: true }
        projectCategory: { type: string, nullable: true }
        projectLocation: { type: string, nullable: true }
        projectDescription: { type: string, nullable: true }
    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 5000 }
        dueAt: { type: string, format: date-time }
        assigneeId: { type: string, format: uuid }
    UpdateTaskRequest:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, nullable: true, maxLength: 5000 }
        dueAt: { type: string, format: date-time, nullable: true }
        assigneeId: { type: string, format: uuid, nullable: true }
        status: { $ref: '#/components/schemas/TaskStatus' }
    SaveMailTemplateRequest:
      type: object
      required: [key, name, body]
      properties:
        key: { type: string, minLength: 1 }
        name: { type: string, minLength: 1 }
        channel: { type: string }
        subject: { type: string }
        body: { type: string, minLength: 1 }
        description: { type: string }
        isActive: { type: boolean }
    ImportMailTemplatesRequest:
      type: object
      required: [templates]
      properties:
        templates:
          type: array
          items: { $ref: '#/components/schemas/SaveMailTemplateRequest' }
    CreateMailDraftRequest:
      type: object
      required: [leadId, templateKey]
      properties:
        leadId: { type: string, format: uuid }
        templateKey: { type: string, minLength: 1 }
        manualInstruction: { type: string }
    UpdateMailRequest:
      type: object
      properties:
        subject: { type: string }
        body: { type: string }
    UpdateMailChecklistRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UpdateMailChecklistItem'
    UpdateMailChecklistItem:
      type: object
      required: [key, label, checked]
      properties:
        key: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
        checked: { type: boolean }
    RejectMailRequest:
      type: object
      properties:
        reason: { type: string }
    MarkMailSentRequest:
      type: object
      properties:
        sentAt: { type: string, format: date-time }
    CreateMailReplyRequest:
      type: object
      required: [body]
      properties:
        fromEmail: { type: string }
        body: { type: string, minLength: 1 }
        receivedAt: { type: string, format: date-time }
    GenerateMailRequest:
      type: object
      required: [templateKey]
      properties:
        templateKey: { type: string, minLength: 1 }
        tone: { type: string }
    CreateTrackedLinkRequest:
      type: object
      required: [emailId, originalUrl]
      properties:
        emailId: { type: string, format: uuid }
        originalUrl: { type: string, minLength: 1 }
        label:
          type: string
          enum: [company_material]
    UnsubscribeRequest:
      type: object
      properties:
        email: { type: string }
        contactId: { type: string }
